      saveAs: bp
    - tool: list_products
      args: { name: "Agua", limit: 5 }
      saveAs: agua
    - tool: create_invoice
      args: { contact_id: "{{steps.bp.id}}", date: "{{today}}", description: "{{marker}}",
              items: [{ name: "Agua", product_id: "{{steps.agua.items.0.id}}", units: 1, price: 100 }] }
      saveAs: invoice
    - tool: list_invoices
      args: { contact_id: "{{steps.bp.id}}", approval_status: draft, limit: 50 }
      saveAs: drafts
    - tool: approve_invoice
      forEach: "{{steps.drafts.items}}"
      args: { invoiceId: "{{item.id}}" }

