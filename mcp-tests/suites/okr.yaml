  # --- Holded setups (docs/mcp-evaluation/okr-o2-holded-coverage.md; catalogue of 367 tools) ---
  # Holded answers a create with `{id}` and a list with `{items, cursor, has_more}`. Products are
  # found by name with `list_products { name }`, like the Etendo side reads them by name. An issued
  # invoice is an approved one. `create_invoice` / `create_purchase` make a draft unless the account
  # approves new documents itself, so a setup approves only what is still a draft: it lists the
  # contact's drafts and approves each one (zero times on an auto-approving account; D41 idiom).

  h-customer: &h-customer
    - tool: create_contact
      args: { name: "Cliente {{marker}}", type: client }
      saveAs: bp

  h-supplier: &h-supplier
    - tool: create_contact
      args: { name: "Prov. {{marker}}", type: supplier }
      saveAs: sup

  # The customer plus one issued invoice: 1 Agua at 100 € + 21 % VAT = 121 € outstanding.
