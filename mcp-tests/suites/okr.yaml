# OKR O2 comparison suite (ETP-5848; plan docs/plans/2026-10-22-mcp-okr-metric-base-plan.md).
#
# One probe per approved flow of docs/mcp-evaluation/okr-o2-flows.md (the flow id is the probe id).
# Prompts are what a person would write: they never say how to do it, never name a tool, and carry
# no context a user would not give. What a probe needs beforehand is built by its `setup`, through
# each platform's own MCP. Verification reads the result, not the path.
#
# Every attempt gets its own `{{marker}}`, so probes never share records: the customer of a probe is
# "Cliente {{marker}}", created by its setup.
#
# DATA (etendo-go): the GOClient tenant of a local-env environment, with the two data fixes of the
# plan §7.5 applied and the accounting period of the run's month OPEN. December 2026 must stay
# CLOSED: `e-closed-period` depends on it. Products are read by name ("Agua", "Fernet", "Cerveza").
# GOClient has no service: create once a product "Hora de instalación" (searchKey INSTALACION, type
# service) with a 50 € price on "Tarifa de venta principal" (`f-order-direct-invoice`).
# GOClient has no G/L item for transfers between its own accounts: create once, in the chart
# "Arbol de cuentas GO", the subaccount 55500001 "Traspasos internos" under 5550 (its G/L item comes
# with it) (`f-bank-account-transfer`). The bank account "Cuenta de Banco" of GOClient receives the
# statement of `f-bank-reconciliation`.
#
# DATA (holded): a Spanish Holded account authorized as Operator with the full catalogue (367
# tools on 2026-11-05; a narrower credential hides tools and makes every block below wrong). It
# needs, created once: the products "Agua", "Fernet", "Cerveza" and "Queso Sardo" (21 % VAT, with
# stock in the main warehouse), the service "Hora de instalación" at 50 €, a second warehouse
# (`f-warehouse-transfer` reads it as the second of `list_warehouses`), a cash account "Caja" and a
# bank account "Cuenta de Banco" (`f-bank-reconciliation`).
# Probes find them by name, as on Etendo.
#
# Every probe has a Holded block, written from the live tools/list and the live checks of
# docs/mcp-evaluation/okr-o2-holded-coverage.md: 34 possible, 8 `notPossible` with their reason.
# Holded amounts are strings with a decimal comma ("36,30"); the runner compares them as numbers.
# Holded's `end_date` filters exclude the day itself when given as a bare date: a read up to today
# passes `{{today}}T23:59:59+00:00`.
# Read probes sum Holded's lists with `aggregate` (runner/aggregate.py): it has no summed reads.

schemaVersion: 2
window: okr
decision: { ruleVersion: 3 }

