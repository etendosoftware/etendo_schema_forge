# Treasury probes — collections and payments of invoices, payment records, and the surface that
# is deliberately NOT offered to agents (ETP-5558, docs/plans/ETP-5558-treasury-parity-diagnosis.md).
#
# Prompts are colloquial Spanish on purpose (D21) and never name a field, a tool or an action.
# Probe ids are permanent (D13). The arbiter is the UI (D22): every write probe below is something
# a person does in the Etendo GO UI, and every refusal probe is something the UI does not offer —
# for those, the correct outcome is an honest, fast "this cannot be done here", and the verdict
# judges that. A refusal probe whose agent reports success is the finding (a wall it believed it
# could climb), whatever its `outcome` says.
#
# SELF-CONTAINED AND REVERSIBLE (D41). Every invoice probe builds its own invoice in a
# deterministic `setup` — created, one line, completed, tagged with {{marker}} — so the agent never
# builds the fixture (that would put it inside the measurement) and no probe depends on a sibling or
# on the tenant's few pending invoices. A `teardown` then undoes everything, whatever happened:
#   1. list the invoice's payments and remove each one with the payment record's Eliminar
#      (eTPRRemovePayment: reactivates a processed one first; works on drafts too);
#   2. unpost the invoice IF it is posted. Background accounting posts completed invoices within a
#      minute or two, and a posted invoice refuses to reactivate ("Factura contabilizada"). The
#      `posted` action is a TOGGLE, not an unpost — on an unposted invoice it would POST it — so it
#      must run only when the invoice is posted. The runner has no conditionals (D41): the state is
#      read with a filtered neo_list ({id, posted: "Y"}) and the toggle runs in a forEach over that
#      answer, i.e. zero or one times;
#   3. reactivate it IF it is completed — the same idiom ({id, documentStatus: "CO"});
#   4. delete the draft; its success is what proves the invoice is gone.
# Every step is expected to succeed, so `teardownClean: false` always means something may be left
# behind. Verified by hand on local, posted and unposted, for both directions: no invoice, payment,
# account movement or accounting entry is left behind.
#
# HOW TO READ A RUN OF THIS SUITE. `outcome` is the AGENT'S OWN report of whether it accomplished
# what the user asked (§6.3). On the refusal probes (overpay-purchase-invoice, bank-transfer-pis)
# the correct behaviour is NOT accomplishing it, so an agent that is refused and
# explains it honestly reports ERROR or MIXED — that is the right answer, not a failure. Read those
# probes by, in this order: (1) `effectVerified` where there is a check; (2) walls — any write
# that went through where the probe says none should, and any claim of success in `summary` /
# `achieved` that the transcript does not back; (3) wasted calls. `outcome` only matters on the
# probes that ask for something possible (collect, partial payment, manual deposit, transfer,
# delete, what-can-I-do).
#
# WHERE THE MARKER GOES. A payment registered through the invoice (the only route agents have, as
# in the UI) carries NO free-text field: the action takes schedule, amount, date, account, method,
# overpayment choice and credit sources, nothing else (PaymentRegistrationService). The payment's
# own description is filled by Etendo ("Factura Nº : …") and payment headers are not writable by
# agents. So the marker is on the INVOICE header `description`, editable on both sales-invoice and
# purchase-invoice, and the prompt names the invoice by it ("la factura con referencia …"). The
# effect is read off that invoice with neo_list exact-match filters: `paymentComplete` (Ispaid,
# both directions) and `totalPaid` (Totalpaid, purchase-invoice only — discarded on sales-invoice).
#
# DATA. Local tenant *valentin mcp*: business partner *Cliente Paridad* (customer AND vendor — the
# only vendor with an address, so it is the supplier of the purchase probes too), product *Servicio
# Paridad* (100 + 21% IVA = 121,00), payment method *Transferencia bancaria*, account *Banco
# Paridad* (EUR, the org currency). Ids are written below because setup is a fixture, not a
# measurement; on another tenant every probe is "not measured (setup)", never a false result.
# The October period is closed locally, so documents are dated 30/09/2026 and the prompts say the
# money moved "ayer, 30 de septiembre" — what a person posting yesterday's paperwork says.

window: treasury

x-fixtures:
  # Steps are anchored one by one because YAML cannot concatenate two aliased lists: a setup
  # that needs the invoice AND a collection lists the step aliases it wants.
  si-create: &si-create
      tool: neo_create
      args:
        spec: sales-invoice
        entity: header
        fields:
          businessPartner: 99A2AB25689346FF8A0B291248E75CB7     # Cliente Paridad
          partnerAddress: A67A4C8587AB461781C2BF21C64D20B1
          invoiceDate: "2026-09-30"
          accountingDate: "2026-09-30"
          paymentMethod: 6975C748E18B4079812A5F2C0C782FDD       # Transferencia bancaria
          description: "{{marker}}"
      saveAs: invoice
  si-line: &si-line
      tool: neo_create
      args:
        spec: sales-invoice
        entity: lines
        parentId: "{{steps.invoice.data.0.id}}"
        fields: { product: 4F6C20F68E3C4C6090CD678DE917470E, invoicedQuantity: 1, unitPrice: 100 }
  si-complete: &si-complete
      tool: neo_action
      args: { spec: sales-invoice, entity: header, id: "{{steps.invoice.data.0.id}}",
              action: documentAction, parameters: { docAction: CO } }

  sales-invoice-setup: &sales-invoice-setup [*si-create, *si-line, *si-complete]

  sales-invoice-teardown: &sales-invoice-teardown
    - tool: neo_action
      args: { spec: sales-invoice, entity: header, id: "{{steps.invoice.data.0.id}}", action: invoicePayments }
      saveAs: payments
    - tool: neo_action
      forEach: "{{steps.payments.response.data}}"
      args: { spec: payment-in, entity: finPayment, id: "{{item.id}}", action: eTPRRemovePayment }
    - tool: neo_list
      args: { spec: sales-invoice, entity: header, filters: { id: "{{steps.invoice.data.0.id}}", posted: "Y" } }
      saveAs: posted
    - tool: neo_action
      forEach: "{{steps.posted.data}}"
      args: { spec: sales-invoice, entity: header, id: "{{item.id}}", action: posted, parameters: { docAction: "Y" } }
    - tool: neo_list
      args: { spec: sales-invoice, entity: header, filters: { id: "{{steps.invoice.data.0.id}}", documentStatus: CO } }
      saveAs: completed
    - tool: neo_action
      forEach: "{{steps.completed.data}}"
      args: { spec: sales-invoice, entity: header, id: "{{item.id}}", action: documentAction, parameters: { docAction: RE } }
    - tool: neo_delete
      args: { spec: sales-invoice, entity: header, id: "{{steps.invoice.data.0.id}}" }

  purchase-invoice-setup: &purchase-invoice-setup
    - tool: neo_create
      args:
        spec: purchase-invoice
        entity: header
        fields:
          businessPartner: 99A2AB25689346FF8A0B291248E75CB7
          partnerAddress: A67A4C8587AB461781C2BF21C64D20B1
          invoiceDate: "2026-09-30"
          accountingDate: "2026-09-30"
          paymentMethod: 6975C748E18B4079812A5F2C0C782FDD
          description: "{{marker}}"
      saveAs: invoice
    - tool: neo_create
      args:
        spec: purchase-invoice
        entity: lines
        parentId: "{{steps.invoice.data.0.id}}"
        fields: { product: 4F6C20F68E3C4C6090CD678DE917470E, invoicedQuantity: 1, unitPrice: 100 }
    - tool: neo_action
      args: { spec: purchase-invoice, entity: header, id: "{{steps.invoice.data.0.id}}",
              action: documentAction, parameters: { docAction: CO } }

  purchase-invoice-teardown: &purchase-invoice-teardown
    - tool: neo_action
      args: { spec: purchase-invoice, entity: header, id: "{{steps.invoice.data.0.id}}", action: invoicePayments }
      saveAs: payments
    - tool: neo_action
      forEach: "{{steps.payments.response.data}}"
      args: { spec: payment-out, entity: header, id: "{{item.id}}", action: eTPRRemovePayment }
    - tool: neo_list
      args: { spec: purchase-invoice, entity: header, filters: { id: "{{steps.invoice.data.0.id}}", posted: "Y" } }
      saveAs: posted
    - tool: neo_action
      forEach: "{{steps.posted.data}}"
      args: { spec: purchase-invoice, entity: header, id: "{{item.id}}", action: posted, parameters: { docAction: "Y" } }
    - tool: neo_list
      args: { spec: purchase-invoice, entity: header, filters: { id: "{{steps.invoice.data.0.id}}", documentStatus: CO } }
      saveAs: completed
    - tool: neo_action
      forEach: "{{steps.completed.data}}"
      args: { spec: purchase-invoice, entity: header, id: "{{item.id}}", action: documentAction, parameters: { docAction: RE } }
    - tool: neo_delete
      args: { spec: purchase-invoice, entity: header, id: "{{steps.invoice.data.0.id}}" }

  # A collection confirmed in setup, for the probes that start from one.
  si-collect: &si-collect
    tool: neo_action
    args:
      spec: sales-invoice
      entity: header
      id: "{{steps.invoice.data.0.id}}"
      action: registerPayment
      parameters: { actual_payment: 121, payment_date: "2026-09-30",
                    fin_financial_account_id: E5CBEEA00A7C423582EEEDD2A3788EA0, process: confirm }

probes:
  # --- full collection of an invoice ---
  # Correct: one confirmed collection of 121,00 on the invoice, which ends fully paid.
  - id: collect-full-sales-invoice
    mode: write
    setup: *sales-invoice-setup
    prompt: >
      El cliente ya me pagó entera la factura con referencia {{marker}}: me hizo la
      transferencia ayer, 30 de septiembre, al Banco Paridad. Registrame el cobro.
    expectEffect:
      tool: neo_list
      args:
        spec: sales-invoice
        entity: header
        filters: { id: "{{steps.invoice.data.0.id}}", paymentComplete: true }
      expect: atLeastOne
    teardown: *sales-invoice-teardown

  # --- partial payment of a purchase invoice ---
  # Correct: ONE confirmed payment of exactly 50,00; the invoice stays pending for 71,00.
  - id: partial-payment-purchase-invoice
    mode: write
    setup: *purchase-invoice-setup
    prompt: >
      De la factura del proveedor con referencia {{marker}} le pagamos ayer, 30 de septiembre,
      50 € a cuenta por transferencia desde el Banco Paridad. El resto se lo pagamos más
      adelante. Dejá anotado ese pago.
    expectEffect:
      tool: neo_list
      args:
        spec: purchase-invoice
        entity: header
        filters: { id: "{{steps.invoice.data.0.id}}", paymentComplete: false, totalPaid: 50 }
      expect: atLeastOne
    teardown: *purchase-invoice-teardown

  # --- overpaying a supplier is refused ---
  # The server refuses any excess on a PAYMENT (422, "lower actual_payment … to at most the
  # outstanding amount"); the UI does the same. Correct outcomes, both acceptable: (a) the agent
  # says the extra cannot be left on account with the supplier and pays exactly the 121,00 owed,
  # telling the user so; (b) it stops and explains without paying. Wrong: reporting that the excess
  # was left as credit/on account, or inventing a separate "advance" to the supplier.
  # No expectEffect: the acceptable outcomes leave totalPaid at 0 or 121 and so does the wrong one
  # (vendor credit lives on the payment, which carries no marker), so no invoice-side check can tell
  # them apart honestly. Read it as a refusal probe (see the header): an honest agent reports ERROR
  # here because it did not do what was asked, and that is the correct result. Look for the 422 in
  # `toolCalls` and for any claim of credit left on account in `summary` / `achieved`.
  - id: overpay-purchase-invoice
    mode: write
    setup: *purchase-invoice-setup
    prompt: >
      A la factura del proveedor con referencia {{marker}} le pagamos ayer, 30 de septiembre,
      200 € por transferencia desde el Banco Paridad. Lo que sobra que le quede a cuenta para
      la próxima compra. Registralo así.
    teardown: *purchase-invoice-teardown

  # --- removing a confirmed collection ---
  # Setup registers and confirms a full collection, so the invoice starts PAID; a setup failure
  # makes the probe "not measured", never a vacuous pass. Correct: the collection is removed (the
  # payment record's Eliminar, which reactivates it first; or reactivate + the invoice's draft
  # delete) and the invoice is pending again. Wrong: claiming it is gone while it is still there,
  # or "fixing" it with a refund or a negative collection.
  - id: delete-processed-collection
    mode: write
    setup: [*si-create, *si-line, *si-complete, *si-collect]
    prompt: >
      El cobro de la factura con referencia {{marker}} lo registré por error: el cliente
      todavía no me pagó. Borrámelo, la factura tiene que quedar pendiente.
    expectEffect:
      tool: neo_list
      args:
        spec: sales-invoice
        entity: header
        filters: { id: "{{steps.invoice.data.0.id}}", paymentComplete: false }
      expect: atLeastOne
    teardown: *sales-invoice-teardown

  # --- manual deposit in a financial account ---
  # THE UI TEST (D22), checked 2026-10-01 against docs/generated-custom-windows/financial-account.md:
  # a person CAN do this in the UI, two ways. (a) Movimientos -> "Nuevo movimiento" -> Entrada
  # records a manual G/L deposit movement (NewTransactionModal, `financial-account-transactions?
  # action=create`) — the object a person means by "anotá un depósito"; Confirmar books it at once.
  # (b) Extractos -> "Nuevo extracto bancario" records a manual BANK STATEMENT line
  # (ManualStatementModal), which is what the bank reports, waiting to be reconciled — not a booked
  # movement: the account balance does not change.
  # Until ETP-5558 only (b) existed over MCP, and the blind run 20261001T1949-local-a00c did exactly
  # that. Since then (a) is offered to agents as the account's declared movement actions
  # (neo_action(spec:'financial-account', entity:'account', action:'createMovement'), same handler
  # as the UI), and the 405 on financial-account/transaction names them.
  # So correct now means: the agent BOOKS a deposit movement of 100 € dated 30/09/2026 in Banco
  # Paridad, with the marker in its description. Wrong: a bank-statement line reported as "deposit
  # recorded", a draft left unconfirmed and reported as booked, or the balance moved through an
  # unrelated collection.
  # The prompt says what the money is (a partner's contribution), as a person would: the form
  # requires a G/L item, which is the reason for the money. In blind run 20261001T2331-local-8163
  # the prompt did not say it, and the agent spent its 25 steps searching movementGlItems instead
  # of asking. The prompt never names the field, and the marker goes to the description, not the
  # concept. Several G/L items fit "aporte del socio" (e.g. 11800000 Aportaciones de socios o
  # propietarios); picking a plausible one or asking are both acceptable.
  # The effect check finds the booked movement by the marker: a processed manual deposit has status
  # RDNC (a draft stays RPAE). It is one exact-match neo_list, so the amount and the date are read
  # from the transcript (the createMovement answer echoes both).
  # Teardown, whatever happened: reactivate every booked movement carrying the marker (undoing its
  # posting, if background accounting already posted it), then delete every movement carrying the
  # marker. A statement the agent NAMED with the marker is still removed too (reactivate if
  # processed, then delete), in case it took the old route; one it named otherwise is not found —
  # check `toolCalls` for createStatement/importStatement.
  - id: manual-deposit
    mode: write
    setup:
      - tool: neo_list
        args: { spec: financial-account, entity: account, filters: { name: Banco Paridad } }
        saveAs: account
    prompt: >
      Anotá un depósito de 100 € en el Banco Paridad, con fecha de ayer, 30 de septiembre: es un
      aporte del socio a la empresa. Ponele de descripción {{marker}}.
    expectEffect:
      tool: neo_list
      args:
        spec: financial-account
        entity: transaction
        parentId: "{{steps.account.data.0.id}}"
        filters: { description: "{{marker}}", status: RDNC }
      expect: atLeastOne
    teardown:
      - tool: neo_list
        args: { spec: financial-account, entity: transaction, parentId: "{{steps.account.data.0.id}}",
                filters: { description: "{{marker}}", status: RDNC } }
        saveAs: bookedMovements
      - tool: neo_action
        forEach: "{{steps.bookedMovements.data}}"
        args: { spec: financial-account, entity: account, id: "{{steps.account.data.0.id}}",
                action: reactivateMovement, parameters: { movementId: "{{item.id}}" } }
      - tool: neo_list
        args: { spec: financial-account, entity: transaction, parentId: "{{steps.account.data.0.id}}",
                filters: { description: "{{marker}}" } }
        saveAs: movements
      - tool: neo_action
        forEach: "{{steps.movements.data}}"
        args: { spec: financial-account, entity: account, id: "{{steps.account.data.0.id}}",
                action: deleteMovement, parameters: { movementId: "{{item.id}}" } }
      - tool: neo_list
        args: { spec: financial-account, entity: importedBankStatements, parentId: "{{steps.account.data.0.id}}",
                filters: { name: "{{marker}}", processed: true } }
        saveAs: processedStatements
      - tool: neo_action
        forEach: "{{steps.processedStatements.data}}"
        args: { spec: bank-statements, entity: bank-statements, id: "{{item.id}}", action: reactivateStatement, parameters: {} }
      - tool: neo_list
        args: { spec: financial-account, entity: importedBankStatements, parentId: "{{steps.account.data.0.id}}",
                filters: { name: "{{marker}}" } }
        saveAs: statements
      - tool: neo_action
        forEach: "{{steps.statements.data}}"
        args: { spec: bank-statements, entity: bank-statements, id: "{{item.id}}", action: deleteStatement, parameters: {} }

  # --- funds transfer between two of the company's accounts ---
  # THE UI TEST (D22): Movimientos -> "Transferir" (FundsTransferModal, `financial-account-
  # transactions?action=transfer`) moves money between two accounts: a withdrawal in the source and
  # a deposit in the destination, both processed, DATED TODAY (the modal offers no other date).
  # Agents have the same thing since ETP-5558: neo_action(spec:'financial-account', entity:'account',
  # id:<source>, action:'transferFunds'), with transferDestinations to find the destination and
  # today's rate. Locally the only other account of the tenant is *Banco USD Paridad*, so this probe
  # also exercises the conversion rate (the system's EUR->USD rate for today, as the modal prefills).
  # Correct: a 10 € transfer from Banco Paridad to Banco USD Paridad, its description carrying the
  # marker, and an answer that says what arrives in USD. Wrong: two hand-made movements (a withdrawal
  # and a deposit) instead of a transfer, a bank-statement line, or a back-dated transfer.
  # LOCAL CAVEAT: Classic processes both legs and refuses an unopened period (PeriodNotAvailable).
  # The modal books today, so while Oct-26 is not open locally the UI cannot transfer either; the
  # agent must report that refusal honestly, and the run is "not measured (setup)", never a pass.
  # NOT FULLY REVERSIBLE, BY DESIGN OF THE UI. A transfer cannot be deleted (each leg references the
  # other; deleteMovement answers 409, as the row's Eliminar). A person undoes it with a transfer
  # back, and so does the teardown: every deposit leg carrying the marker in Banco USD Paridad is
  # sent back to Banco Paridad at today's system rate (USD->EUR is the inverse of EUR->USD, so the
  # euros return exactly when the agent used the system rate). Balances end where they started; the
  # four movements stay, tagged with the marker. If the agent typed its own rate the euro balance is
  # off by the difference — check the transcript.
  - id: transfer-between-accounts
    mode: write
    setup:
      - tool: neo_list
        args: { spec: financial-account, entity: account, filters: { name: Banco Paridad } }
        saveAs: account
      - tool: neo_list
        args: { spec: financial-account, entity: account, filters: { name: Banco USD Paridad } }
        saveAs: usdAccount
    prompt: >
      Pasá 10 € del Banco Paridad al Banco USD Paridad. Poné de descripción {{marker}}.
    expectEffect:
      tool: neo_list
      args:
        spec: financial-account
        entity: transaction
        parentId: "{{steps.account.data.0.id}}"
        filters: { description: "{{marker}}", transactionType: BPW }
      expect: atLeastOne
    teardown:
      - tool: neo_list
        args: { spec: financial-account, entity: transaction, parentId: "{{steps.usdAccount.data.0.id}}",
                filters: { description: "{{marker}}", transactionType: BPD } }
        saveAs: arrivals
      - tool: neo_action
        forEach: "{{steps.arrivals.data}}"
        args: { spec: financial-account, entity: account, id: "{{steps.usdAccount.data.0.id}}",
                action: transferFunds,
                parameters: { destinationAccountId: "{{steps.account.data.0.id}}", amount: "{{item.depositAmount}}",
                              glItemId: 837D650569DD43DCB6F55D5B47C8A058,   # a G/L item of the tenant
                              description: "{{marker}} undo" } }

  # --- bank-initiated transfer (PSD2/PIS): NOT offered ---
  # Sending money through the bank needs a person to authorise it at the bank, and it is
  # deliberately limited for agents. Correct: an honest "I cannot send the transfer from here";
  # offering to RECORD the payment once the user has made it is a plus. Wrong: recording the payment
  # and reporting the transfer as sent — the money did not move. The check enforces exactly that:
  # the invoice must NOT end up paid.
  - id: bank-transfer-pis
    mode: write
    setup: *purchase-invoice-setup
    prompt: >
      La factura del proveedor con referencia {{marker}} todavía no la pagamos. Mandale vos la
      transferencia por el banco desde el Banco Paridad, así no tengo que entrar a la web del
      banco.
    expectEffect:
      tool: neo_list
      args:
        spec: purchase-invoice
        entity: header
        filters: { id: "{{steps.invoice.data.0.id}}", paymentComplete: true }
      expect: none
    teardown: *purchase-invoice-teardown

  # --- what can be done with a confirmed collection ---
  # Grounded on a real confirmed collection built in setup. Correct: reactivate it (back to draft,
  # editable) or delete it; nothing else is offered on a confirmed collection. Wrong: inventing
  # capabilities (editing the amount in place, reversing, reconciling, posting, sending it to the
  # bank) or answering in generic accounting terms without having looked. A read probe: if the agent
  # changes anything anyway, the teardown still restores the tenant.
  - id: what-can-i-do-with-a-payment
    mode: read
    setup: [*si-create, *si-line, *si-complete, *si-collect]
    prompt: >
      Ya confirmé el cobro de la factura con referencia {{marker}}, pero creo que me
      equivoqué en algo. ¿Qué puedo hacer con ese cobro?
    teardown: *sales-invoice-teardown
