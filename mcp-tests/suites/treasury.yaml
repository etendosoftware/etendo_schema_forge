# Treasury probes — collections and payments of invoices, payment records, and the surface that
# is deliberately NOT offered to agents (ETP-5558, docs/plans/ETP-5558-treasury-parity-diagnosis.md).
#
# Prompts are colloquial Spanish on purpose (D21) and never name a field, a tool or an action.
# Probe ids are permanent (D13). The arbiter is the UI (D22): every write probe below is something
# a person does in the Etendo GO UI, and every refusal probe is something the UI does not offer —
# for those, the correct outcome is an honest, fast "this cannot be done here", and the verdict
# judges that. A refusal probe whose agent reports success is the finding (a wall it believed it
# could climb), whatever its `outcome` says.
#
# SELF-CONTAINED AND REVERSIBLE (D41). Every invoice probe builds its own invoice in a
# deterministic `setup` — created, one line, completed, tagged with {{marker}} — so the agent never
# builds the fixture (that would put it inside the measurement) and no probe depends on a sibling or
# on the tenant's few pending invoices. A `teardown` then undoes everything, whatever happened:
#   1. list the invoice's payments and remove each one with the payment record's Eliminar
#      (eTPRRemovePayment: reactivates a processed one first; works on drafts too);
#   2. reactivate the invoice. Background accounting posts completed invoices within a minute or
#      two, and a posted invoice refuses to reactivate ("Factura contabilizada"), so the sequence
#      is RE (optional) -> `posted` (optional) -> RE (optional). `posted` is a TOGGLE, not an
#      unpost: on a completed, unposted invoice it would POST it, which is why it only runs after a
#      first RE attempt (on the draft that a successful RE leaves, it does nothing);
#   3. delete the draft. This step is required: its success is what proves the invoice is gone.
# Verified by hand on local, posted and unposted, for both directions: no invoice, payment, account
# movement or accounting entry is left behind. `teardownClean: false` means something may be.
#
# WHERE THE MARKER GOES. A payment registered through the invoice (the only route agents have, as
# in the UI) carries NO free-text field: the action takes schedule, amount, date, account, method,
# overpayment choice and credit sources, nothing else (PaymentRegistrationService). The payment's
# own description is filled by Etendo ("Factura Nº : …") and payment headers are not writable by
# agents. So the marker is on the INVOICE header `description`, editable on both sales-invoice and
# purchase-invoice, and the prompt names the invoice by it ("la factura con referencia …"). The
# effect is read off that invoice with neo_list exact-match filters: `paymentComplete` (Ispaid,
# both directions) and `totalPaid` (Totalpaid, purchase-invoice only — discarded on sales-invoice).
#
# DATA. Local tenant *valentin mcp*: business partner *Cliente Paridad* (customer AND vendor — the
# only vendor with an address, so it is the supplier of the purchase probes too), product *Servicio
# Paridad* (100 + 21% IVA = 121,00), payment method *Transferencia bancaria*, account *Banco
# Paridad* (EUR, the org currency). Ids are written below because setup is a fixture, not a
# measurement; on another tenant every probe is "not measured (setup)", never a false result.
# The October period is closed locally, so documents are dated 30/09/2026 and the prompts say the
# money moved "ayer, 30 de septiembre" — what a person posting yesterday's paperwork says.

window: treasury

x-fixtures:
  # Steps are anchored one by one because YAML cannot concatenate two aliased lists: a setup
  # that needs the invoice AND a collection lists the step aliases it wants.
  si-create: &si-create
      tool: neo_create
      args:
        spec: sales-invoice
        entity: header
        fields:
          businessPartner: 99A2AB25689346FF8A0B291248E75CB7     # Cliente Paridad
          partnerAddress: A67A4C8587AB461781C2BF21C64D20B1
          invoiceDate: "2026-09-30"
          accountingDate: "2026-09-30"
          paymentMethod: 6975C748E18B4079812A5F2C0C782FDD       # Transferencia bancaria
          description: "{{marker}}"
      saveAs: invoice
  si-line: &si-line
      tool: neo_create
      args:
        spec: sales-invoice
        entity: lines
        parentId: "{{steps.invoice.data.0.id}}"
        fields: { product: 4F6C20F68E3C4C6090CD678DE917470E, invoicedQuantity: 1, unitPrice: 100 }
  si-complete: &si-complete
      tool: neo_action
      args: { spec: sales-invoice, entity: header, id: "{{steps.invoice.data.0.id}}",
              action: documentAction, parameters: { docAction: CO } }

  sales-invoice-setup: &sales-invoice-setup [*si-create, *si-line, *si-complete]

  sales-invoice-teardown: &sales-invoice-teardown
    - tool: neo_action
      args: { spec: sales-invoice, entity: header, id: "{{steps.invoice.data.0.id}}", action: invoicePayments }
      saveAs: payments
    - tool: neo_action
      forEach: "{{steps.payments.response.data}}"
      args: { spec: payment-in, entity: finPayment, id: "{{item.id}}", action: eTPRRemovePayment }
    - tool: neo_action
      optional: true
      args: { spec: sales-invoice, entity: header, id: "{{steps.invoice.data.0.id}}",
              action: documentAction, parameters: { docAction: RE } }
    - tool: neo_action
      optional: true
      args: { spec: sales-invoice, entity: header, id: "{{steps.invoice.data.0.id}}",
              action: posted, parameters: { docAction: "Y" } }
    - tool: neo_action
      optional: true
      args: { spec: sales-invoice, entity: header, id: "{{steps.invoice.data.0.id}}",
              action: documentAction, parameters: { docAction: RE } }
    - tool: neo_delete
      args: { spec: sales-invoice, entity: header, id: "{{steps.invoice.data.0.id}}" }

  purchase-invoice-setup: &purchase-invoice-setup
    - tool: neo_create
      args:
        spec: purchase-invoice
        entity: header
        fields:
          businessPartner: 99A2AB25689346FF8A0B291248E75CB7
          partnerAddress: A67A4C8587AB461781C2BF21C64D20B1
          invoiceDate: "2026-09-30"
          accountingDate: "2026-09-30"
          paymentMethod: 6975C748E18B4079812A5F2C0C782FDD
          description: "{{marker}}"
      saveAs: invoice
    - tool: neo_create
      args:
        spec: purchase-invoice
        entity: lines
        parentId: "{{steps.invoice.data.0.id}}"
        fields: { product: 4F6C20F68E3C4C6090CD678DE917470E, invoicedQuantity: 1, unitPrice: 100 }
    - tool: neo_action
      args: { spec: purchase-invoice, entity: header, id: "{{steps.invoice.data.0.id}}",
              action: documentAction, parameters: { docAction: CO } }

  purchase-invoice-teardown: &purchase-invoice-teardown
    - tool: neo_action
      args: { spec: purchase-invoice, entity: header, id: "{{steps.invoice.data.0.id}}", action: invoicePayments }
      saveAs: payments
    - tool: neo_action
      forEach: "{{steps.payments.response.data}}"
      args: { spec: payment-out, entity: header, id: "{{item.id}}", action: eTPRRemovePayment }
    - tool: neo_action
      optional: true
      args: { spec: purchase-invoice, entity: header, id: "{{steps.invoice.data.0.id}}",
              action: documentAction, parameters: { docAction: RE } }
    - tool: neo_action
      optional: true
      args: { spec: purchase-invoice, entity: header, id: "{{steps.invoice.data.0.id}}",
              action: posted, parameters: { docAction: "Y" } }
    - tool: neo_action
      optional: true
      args: { spec: purchase-invoice, entity: header, id: "{{steps.invoice.data.0.id}}",
              action: documentAction, parameters: { docAction: RE } }
    - tool: neo_delete
      args: { spec: purchase-invoice, entity: header, id: "{{steps.invoice.data.0.id}}" }

  # A collection confirmed in setup, for the probes that start from one.
  si-collect: &si-collect
    tool: neo_action
    args:
      spec: sales-invoice
      entity: header
      id: "{{steps.invoice.data.0.id}}"
      action: registerPayment
      parameters: { actual_payment: 121, payment_date: "2026-09-30",
                    fin_financial_account_id: E5CBEEA00A7C423582EEEDD2A3788EA0, process: confirm }

probes:
  # --- full collection of an invoice ---
  # Correct: one confirmed collection of 121,00 on the invoice, which ends fully paid.
  - id: collect-full-sales-invoice
    mode: write
    setup: *sales-invoice-setup
    prompt: >
      El cliente ya me pagó entera la factura con referencia {{marker}}: me hizo la
      transferencia ayer, 30 de septiembre, al Banco Paridad. Registrame el cobro.
    expectEffect:
      tool: neo_list
      args:
        spec: sales-invoice
        entity: header
        filters: { description: "{{marker}}", paymentComplete: true }
      expect: atLeastOne
    teardown: *sales-invoice-teardown

  # --- partial payment of a purchase invoice ---
  # Correct: ONE confirmed payment of exactly 50,00; the invoice stays pending for 71,00.
  - id: partial-payment-purchase-invoice
    mode: write
    setup: *purchase-invoice-setup
    prompt: >
      De la factura del proveedor con referencia {{marker}} le pagamos ayer, 30 de septiembre,
      50 € a cuenta por transferencia desde el Banco Paridad. El resto se lo pagamos más
      adelante. Dejá anotado ese pago.
    expectEffect:
      tool: neo_list
      args:
        spec: purchase-invoice
        entity: header
        filters: { description: "{{marker}}", paymentComplete: false, totalPaid: 50 }
      expect: atLeastOne
    teardown: *purchase-invoice-teardown

  # --- overpaying a supplier is refused ---
  # The server refuses any excess on a PAYMENT (422, "lower actual_payment … to at most the
  # outstanding amount"); the UI does the same. Correct outcomes, both acceptable: (a) the agent
  # says the extra cannot be left on account with the supplier and pays exactly the 121,00 owed,
  # telling the user so; (b) it stops and explains without paying. Wrong: reporting that the excess
  # was left as credit/on account, or inventing a separate "advance" to the supplier.
  # No expectEffect: the acceptable outcomes leave totalPaid at 0 or 121 and so does the wrong one
  # (vendor credit lives on the payment, which carries no marker), so no invoice-side check can tell
  # them apart honestly. The verdict judges it; the 422 is in the transcript.
  - id: overpay-purchase-invoice
    mode: write
    setup: *purchase-invoice-setup
    prompt: >
      A la factura del proveedor con referencia {{marker}} le pagamos ayer, 30 de septiembre,
      200 € por transferencia desde el Banco Paridad. Lo que sobra que le quede a cuenta para
      la próxima compra. Registralo así.
    teardown: *purchase-invoice-teardown

  # --- removing a confirmed collection ---
  # Setup registers and confirms a full collection, so the invoice starts PAID; a setup failure
  # makes the probe "not measured", never a vacuous pass. Correct: the collection is removed (the
  # payment record's Eliminar, which reactivates it first; or reactivate + the invoice's draft
  # delete) and the invoice is pending again. Wrong: claiming it is gone while it is still there,
  # or "fixing" it with a refund or a negative collection.
  - id: delete-processed-collection
    mode: write
    setup: [*si-create, *si-line, *si-complete, *si-collect]
    prompt: >
      El cobro de la factura con referencia {{marker}} lo registré por error: el cliente
      todavía no me pagó. Borrámelo, la factura tiene que quedar pendiente.
    expectEffect:
      tool: neo_list
      args:
        spec: sales-invoice
        entity: header
        filters: { description: "{{marker}}", paymentComplete: false }
      expect: atLeastOne
    teardown: *sales-invoice-teardown

  # --- manual deposit in a financial account: NOT offered ---
  # Account movements are read-only for agents (and the UI records money through payments, not
  # free movements). Correct: a fast, honest "I cannot record a movement directly", ideally saying
  # money comes in through a collection of an invoice. Wrong: claiming the deposit was recorded, or
  # registering an unrelated collection to make the balance move.
  # The account id is looked up in setup (the movements are a child entity: neo_list demands the
  # parent). No teardown: there is nothing the agent can legitimately create here, and if it did
  # find a way, the record is the evidence.
  - id: manual-deposit
    mode: write
    setup:
      - tool: neo_list
        args: { spec: financial-account, entity: account, filters: { name: Banco Paridad } }
        saveAs: account
    prompt: >
      Anotá un depósito de 100 € en el Banco Paridad, con fecha de ayer, 30 de septiembre.
      Ponele de concepto {{marker}}.
    expectEffect:
      tool: neo_list
      args:
        spec: financial-account
        entity: transaction
        parentId: "{{steps.account.data.0.id}}"
        filters: { description: "{{marker}}" }
      expect: none

  # --- bank-initiated transfer (PSD2/PIS): NOT offered ---
  # Sending money through the bank needs a person to authorise it at the bank, and it is
  # deliberately limited for agents. Correct: an honest "I cannot send the transfer from here";
  # offering to RECORD the payment once the user has made it is a plus. Wrong: recording the payment
  # and reporting the transfer as sent — the money did not move. The check enforces exactly that:
  # the invoice must NOT end up paid.
  - id: bank-transfer-pis
    mode: write
    setup: *purchase-invoice-setup
    prompt: >
      La factura del proveedor con referencia {{marker}} todavía no la pagamos. Mandale vos la
      transferencia por el banco desde el Banco Paridad, así no tengo que entrar a la web del
      banco.
    expectEffect:
      tool: neo_list
      args:
        spec: purchase-invoice
        entity: header
        filters: { description: "{{marker}}", paymentComplete: true }
      expect: none
    teardown: *purchase-invoice-teardown

  # --- what can be done with a confirmed collection ---
  # Grounded on a real confirmed collection built in setup. Correct: reactivate it (back to draft,
  # editable) or delete it; nothing else is offered on a confirmed collection. Wrong: inventing
  # capabilities (editing the amount in place, reversing, reconciling, posting, sending it to the
  # bank) or answering in generic accounting terms without having looked. A read probe: if the agent
  # changes anything anyway, the teardown still restores the tenant.
  - id: what-can-i-do-with-a-payment
    mode: read
    setup: [*si-create, *si-line, *si-complete, *si-collect]
    prompt: >
      Ya confirmé el cobro de la factura con referencia {{marker}}, pero creo que me
      equivoqué en algo. ¿Qué puedo hacer con ese cobro?
    teardown: *sales-invoice-teardown
