name: Deploy SPA

on:
  push:
    branches:
      - develop
      - main
      - epic/ETP-3504
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - experimental

jobs:
  deploy:
    name: Build & deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    env:
      SF_ROOT: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment target
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ inputs.environment }}"
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            TARGET="staging"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            TARGET="production"
          else
            TARGET="experimental"
          fi

          # configcat_sdk_key is resolved PER TARGET on purpose. The ConfigCat
          # control plane is a pilot (ETP-4691) running on experimental only, and
          # one SDK key addresses exactly one ConfigCat environment — a single
          # shared variable would make production read the environment the pilot
          # is toggling. An empty value leaves createFlagProvider() on the
          # declared in-memory defaults, i.e. today's behaviour.
          case "$TARGET" in
            production)
              echo "s3_bucket=${{ vars.S3_BUCKET_PRODUCTION }}" >> $GITHUB_OUTPUT
              echo "cf_distribution=${{ vars.CF_DISTRIBUTION_PRODUCTION }}" >> $GITHUB_OUTPUT
              echo "env_label=production" >> $GITHUB_OUTPUT
              echo "public_origin=https://go.etendo.cloud" >> $GITHUB_OUTPUT
              echo "configcat_sdk_key=" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "s3_bucket=${{ vars.S3_BUCKET_STAGING }}" >> $GITHUB_OUTPUT
              echo "cf_distribution=${{ vars.CF_DISTRIBUTION_STAGING }}" >> $GITHUB_OUTPUT
              echo "env_label=staging" >> $GITHUB_OUTPUT
              echo "public_origin=https://go.staging.etendo.cloud" >> $GITHUB_OUTPUT
              echo "configcat_sdk_key=" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "s3_bucket=${{ vars.S3_BUCKET_EXPERIMENTAL }}" >> $GITHUB_OUTPUT
              echo "cf_distribution=${{ vars.CF_DISTRIBUTION_EXPERIMENTAL }}" >> $GITHUB_OUTPUT
              echo "env_label=experimental" >> $GITHUB_OUTPUT
              echo "public_origin=https://go.experimental.etendo.cloud" >> $GITHUB_OUTPUT
              echo "configcat_sdk_key=${{ vars.VITE_CONFIGCAT_SDK_KEY_EXPERIMENTAL }}" >> $GITHUB_OUTPUT
              ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app-shell
        run: npm run build --workspace=tools/app-shell
        env:
          # VITE_PUBLIC_ORIGIN is consumed by mcpWellKnownPlugin (vite.config.js)
          # to emit static RFC 9728 / RFC 8414 discovery docs at /.well-known/*
          # with absolute URLs per environment. See docs/ops/cloudfront-alb-routing.md.
          VITE_PUBLIC_ORIGIN: ${{ steps.target.outputs.public_origin }}
          # VITE_BUILD_ID is unique per workflow run (even same commit) — ensures sw.js
          # always differs between deploys so the service worker updates on every redeploy
          VITE_BUILD_ID: ${{ github.run_id }}
          # CloudWatch RUM — IDs stored as GitHub Actions variables (not in repo)
          VITE_RUM_APP_MONITOR_ID_STAGING: ${{ vars.RUM_APP_MONITOR_ID_STAGING }}
          VITE_RUM_IDENTITY_POOL_ID_STAGING: ${{ vars.RUM_IDENTITY_POOL_ID_STAGING }}
          VITE_RUM_APP_MONITOR_ID_EXPERIMENTAL: ${{ vars.RUM_APP_MONITOR_ID_EXPERIMENTAL }}
          VITE_RUM_IDENTITY_POOL_ID_EXPERIMENTAL: ${{ vars.RUM_IDENTITY_POOL_ID_EXPERIMENTAL }}
          VITE_RUM_APP_MONITOR_ID_PRODUCTION: ${{ vars.RUM_APP_MONITOR_ID_PRODUCTION }}
          VITE_RUM_IDENTITY_POOL_ID_PRODUCTION: ${{ vars.RUM_IDENTITY_POOL_ID_PRODUCTION }}
          # Sentry — DSN as variable (public, baked into JS bundle), token as secret
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Mixpanel — token as secret, API host as variable
          VITE_MIXPANEL_ENABLED: "true"
          VITE_MIXPANEL_TOKEN: ${{ secrets.VITE_MIXPANEL_TOKEN }}
          VITE_MIXPANEL_DEBUG: "false"
          VITE_MIXPANEL_API_HOST: ${{ vars.VITE_MIXPANEL_API_HOST }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # ConfigCat control plane (ETP-4691) — key as variable, not secret: Vite
          # bakes it into the JS bundle, so it is public by construction and
          # masking it would only hide it from the build log. Empty on
          # staging/production while the pilot runs on experimental.
          # `.env.development.local` is NOT read here: it is development-mode only,
          # so without this the deployed bundle has no key and every flag resolves
          # to its declared default.
          VITE_CONFIGCAT_SDK_KEY: ${{ steps.target.outputs.configcat_sdk_key }}
          VITE_CONFIGCAT_POLL_SECONDS: "60"
        # .env.production (committed) provides VITE_MOCK=false and VITE_API_BASE=/etendo

      - name: Generate reports manifest
        run: npx sf-generate-reports-manifest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Sync dist to S3 (${{ steps.target.outputs.env_label }})
        run: |
          # Long-lived immutable assets (hashed files under assets/, icons, etc.)
          # .well-known/* is EXCLUDED here — OAuth2/MCP discovery metadata must
          # never be cached with immutable headers; a rollback or endpoint change
          # would leave stale metadata pinned in every CDN edge for up to a year.
          aws s3 sync tools/app-shell/dist/ s3://${{ steps.target.outputs.s3_bucket }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "registerSW.js" \
            --exclude "manifest.webmanifest" \
            --exclude "sw.js" \
            --exclude ".well-known/*"
          # HTML, SW and manifest must not be cached long-term
          aws s3 sync tools/app-shell/dist/ s3://${{ steps.target.outputs.s3_bucket }}/ \
            --exclude "*" \
            --include "index.html" \
            --include "registerSW.js" \
            --include "manifest.webmanifest" \
            --include "sw.js" \
            --cache-control "no-cache, no-store, must-revalidate"
          # RFC 9728 / RFC 8414 discovery docs — no-cache + explicit JSON
          # content type. These files have no extension (oauth-protected-resource,
          # oauth-authorization-server, openid-configuration) so S3 would otherwise
          # serve them as application/octet-stream, which breaks MCP/OAuth2 clients.
          aws s3 sync tools/app-shell/dist/.well-known/ \
            s3://${{ steps.target.outputs.s3_bucket }}/.well-known/ \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"

      - name: Upload reports manifest (${{ steps.target.outputs.env_label }})
        run: |
          aws s3 cp tools/app-shell/dist/api/reports \
            s3://${{ steps.target.outputs.s3_bucket }}/api/reports \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache (${{ steps.target.outputs.env_label }})
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.target.outputs.cf_distribution }} \
            --paths "/*"

  # The SPA job above only publishes the report *catalog* (dist/api/reports, a
  # static S3 object). The report *renderer* is a separate ECS service whose
  # artifacts/ are baked into its Docker image, and nothing rebuilt that image
  # after 2026-04-16 — so for months every deployed report rendered its April
  # template while the sidebar, fed by the always-fresh S3 catalog, showed the
  # current contract. Nothing looked broken until someone compared a report
  # against local. This job closes that gap: same trigger, same commit, one
  # image per deploy.
  deploy-report-server:
    name: Build & deploy report-server image
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Resolve deployment target
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ inputs.environment }}"
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            TARGET="staging"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            TARGET="production"
          else
            TARGET="experimental"
          fi
          echo "env_label=$TARGET" >> $GITHUB_OUTPUT

          case "$TARGET" in
            production)   echo "ecs_cluster=${{ vars.ECS_CLUSTER_PRODUCTION }}" >> $GITHUB_OUTPUT ;;
            staging)      echo "ecs_cluster=${{ vars.ECS_CLUSTER_STAGING }}" >> $GITHUB_OUTPUT ;;
            *)            echo "ecs_cluster=${{ vars.ECS_CLUSTER_EXPERIMENTAL }}" >> $GITHUB_OUTPUT ;;
          esac

      # The AWS coordinates for report-server (ECR repository, ECS cluster and
      # service) are repository variables, not literals, because they were never
      # captured in code — the service was stood up by hand in April 2026 and
      # only partially written down in docs/ops/cloudfront-alb-routing.md. Until
      # someone with console access fills them in, this job reports loudly and
      # exits green instead of failing every push and blocking the SPA deploy.
      - name: Check report-server deployment is configured
        id: configured
        run: |
          missing=""
          [ -n "${{ vars.ECR_REPOSITORY_REPORT_SERVER }}" ] || missing="$missing ECR_REPOSITORY_REPORT_SERVER"
          [ -n "${{ steps.target.outputs.ecs_cluster }}" ] || missing="$missing ECS_CLUSTER_${{ steps.target.outputs.env_label }}"
          [ -n "${{ vars.ECS_SERVICE_REPORT_SERVER }}" ] || missing="$missing ECS_SERVICE_REPORT_SERVER"
          [ -n "${{ secrets.CORE_REPO_TOKEN }}" ] || missing="$missing CORE_REPO_TOKEN(secret)"

          if [ -n "$missing" ]; then
            echo "::warning title=report-server not deployed::Skipped. Unset repository variables:$missing. Until these are set, server-rendered reports stay frozen on whatever image ECS currently runs — see docs/ops/cloudfront-alb-routing.md."
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.configured.outputs.ready == 'true'

      # server.js, its package.json and the report descriptor live in
      # schema_forge_core; artifacts/ and templates/ live here. Neither repo can
      # build this image alone.
      - name: Checkout schema_forge_core
        if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: etendosoftware/schema_forge_core
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: .schema_forge_core

      - name: Assemble build context
        if: steps.configured.outputs.ready == 'true'
        run: CORE_DIR=.schema_forge_core ./scripts/assemble-report-server-context.sh .report-server-context --clean

      - name: Build image
        if: steps.configured.outputs.ready == 'true'
        run: |
          docker build \
            -f .report-server-context/tools/report-server/Dockerfile \
            -t report-server:${{ github.sha }} \
            .report-server-context

      # Boots the image right here and asserts every artifact inside it is
      # byte-identical to this checkout. Runs BEFORE the push so a stale or
      # non-booting image never reaches ECR — and it needs no NEO credentials.
      - name: Verify image carries current artifacts
        if: steps.configured.outputs.ready == 'true'
        run: ./scripts/verify-report-server-image.sh report-server:${{ github.sha }}

      - name: Configure AWS credentials
        if: steps.configured.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Login to ECR
        if: steps.configured.outputs.ready == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: steps.configured.outputs.ready == 'true'
        id: push
        run: |
          REPO="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_REPORT_SERVER }}"
          docker tag report-server:${{ github.sha }} "$REPO:${{ github.sha }}"
          docker tag report-server:${{ github.sha }} "$REPO:${{ steps.target.outputs.env_label }}"
          docker push "$REPO:${{ github.sha }}"
          docker push "$REPO:${{ steps.target.outputs.env_label }}"
          echo "image=$REPO:${{ github.sha }}" >> $GITHUB_OUTPUT

      # Deploying by immutable digest-style tag (the commit SHA) rather than
      # re-pointing a mutable tag: a force-new-deployment on an unchanged task
      # definition is exactly what made this service look "redeployed" while
      # still serving April's artifacts.
      - name: Register task definition revision and update service
        if: steps.configured.outputs.ready == 'true'
        run: |
          set -euo pipefail
          CLUSTER="${{ steps.target.outputs.ecs_cluster }}"
          SERVICE="${{ vars.ECS_SERVICE_REPORT_SERVER }}"

          CURRENT_TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          echo "current task definition: $CURRENT_TD"

          aws ecs describe-task-definition --task-definition "$CURRENT_TD" \
            --query 'taskDefinition' --output json > td.json

          jq --arg IMAGE "${{ steps.push.outputs.image }}" '
            .containerDefinitions |= map(.image = $IMAGE)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' td.json > td-new.json

          NEW_TD=$(aws ecs register-task-definition --cli-input-json file://td-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "new task definition: $NEW_TD"

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_TD" >/dev/null

          echo "waiting for the service to stabilise..."
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "report-server deployed: ${{ steps.push.outputs.image }}"
