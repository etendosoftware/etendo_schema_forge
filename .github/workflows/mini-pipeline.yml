name: Mini Pipeline

# ETP-5695: the per-PR mini pipeline. It runs the mocked Playwright suite, which needs no backend.
# Timed against the same work on Jenkins, it took 10 min against 24, so it runs here. Where it sits
# in the flow: docs/branch-workflow.md.
#
# ETP-6375: it also runs the unit tests and the Sonar analysis in one job (.github/actions/
# unit-tests-sonar), as com.etendoerp.go's mini pipeline does; they ran in test.yml before. A push
# to develop runs that job alone: develop's analysis is the base the next PRs compare against. Its
# name starts with "Mini Pipeline: " so a check on develop's head (a cut PR's head) can never meet
# main's required "Unit tests + Sonar + coverage", which the full pipeline runs (full-pipeline.yml).

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR replaces its running check; each push to develop is analyzed on its own.
concurrency:
  group: mini-pipeline-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests-sonar:
    name: 'Mini Pipeline: Unit tests + Sonar + coverage'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read   # npm install from npm.pkg.github.com
      checks: write    # dorny/test-reporter publishes the "Test Results" check
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The whole history: Sonar's blame and new-code detection need it.
          fetch-depth: 0

      # ETP-6387: the action comes from this run's own commit (the merge ref on a PR), not from the
      # PR head checked out above: a head older than the action (the main into develop back-merge,
      # a branch that never merged develop) would not have it. Tests and scripts stay the head's.
      - name: Checkout the unit tests action
        uses: actions/checkout@v4
        with:
          path: .ci-actions
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Unit tests + Sonar + coverage
        uses: ./.ci-actions/.github/actions/unit-tests-sonar
        with:
          npm_token: ${{ secrets.GITHUB_TOKEN }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          sonar_host_url: ${{ secrets.SONAR_HOST_URL }}
          sonar_read_token: ${{ secrets.SONAR_READ_TOKEN }}
          coverage_minimum: ${{ vars.COVERAGE_MINIMUM }}
          coverage_tolerance: ${{ vars.COVERAGE_TOLERANCE }}
          sonar_socket_timeout: ${{ vars.SONAR_SOCKET_TIMEOUT }}
          sonar_response_timeout: ${{ vars.SONAR_RESPONSE_TIMEOUT }}

  mocked:
    name: Mocked E2E
    # PRs only: a push to develop only refreshes develop's Sonar analysis.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read   # npm install from npm.pkg.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp .env.example .env
          make install

      # No --with-deps: the runner image already has every library Chromium needs, so apt only added
      # fonts no test uses, and when the Ubuntu mirror did not resolve it hung the job for 10 min and
      # failed it. The browser is cached per Playwright version and downloads only on a bump.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: npx playwright install chromium

      # run-e2e-full.sh builds the no-PWA bundle, serves it, runs the mocked projects and then the
      # quarantined tests without blocking (docs/testing/flaky-tests.md).
      - name: Mocked E2E
        env:
          E2E_SUITE: mocked
          PLAYWRIGHT_HTML_REPORT: ${{ github.workspace }}/e2e/playwright-report-mocked
        run: make test-e2e-headless

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mocked
          path: e2e/playwright-report-mocked
          retention-days: 7
          if-no-files-found: ignore
