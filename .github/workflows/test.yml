name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs are cancelled; every push sha must keep its own artifact.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Test the PR head commit (the sha Jenkins analyzes), not the merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same target Jenkins runs: JUnit XML in test-results/, merged LCOV in coverage/.
      - name: Unit tests with coverage
        run: make test-ci-coverage

      - name: Build app-shell
        run: npm run build --workspace=tools/app-shell

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: test-results/*.xml
          reporter: java-junit
          fail-on-empty: false

      # Consumed later by Jenkins instead of re-running the suites.
      - name: Upload coverage and test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: |
            coverage/merged-lcov.info
            test-results/*.xml
          retention-days: 7
          if-no-files-found: warn

  # Sonar analysis fed with the coverage computed by the test job.
  sonar:
    name: Sonar Build
    needs: test
    # PRs always report the required check; pushes scan only with real coverage.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.test.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Never feed Sonar a partial LCOV; extracts to coverage/ and test-results/.
      - name: Download coverage
        if: needs.test.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage

      - uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_SCANNER_OPTS: "-Xmx4096m"
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Same rule as Jenkins' Compare Coverage Results; fails this check on a drop.
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request' && needs.test.result == 'success'
        with:
          node-version: 22

      - name: Compare coverage with the base branch
        if: github.event_name == 'pull_request' && needs.test.result == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: >-
          node scripts/compare-sonar-coverage.js --context ci
          --pull-request "$PR_NUMBER" --base-branch "$BASE_BRANCH"
          --report-task .scannerwork/report-task.txt
