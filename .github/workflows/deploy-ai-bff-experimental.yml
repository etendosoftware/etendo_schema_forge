name: Deploy AI BFF to Experimental

on:
  push:
    branches:
      - develop
    paths:
      - 'tools/ai-bff/**'
  workflow_dispatch:

concurrency:
  group: deploy-ai-bff-experimental
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: etendo/ai-bff-experimental
  ECS_CLUSTER: etendo-experimental
  ECS_SERVICE: ai-bff-service
  ECS_TASK_FAMILY: ai-bff-experimental

jobs:
  deploy:
    name: Build, publish and deploy AI BFF
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install BFF dependencies
        run: npm ci --prefix tools/ai-bff

      - name: Run BFF regression tests
        run: npm test --prefix tools/ai-bff

      - name: Run Copilot regression tests
        run: npm run test:vitest --workspace=tools/app-shell -- --run src/components/copilot/__tests__/useAiCopilotChat.vitest.jsx src/components/copilot/__tests__/ChatView.vitest.jsx

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push linux/amd64 image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker build --platform linux/amd64 -f tools/ai-bff/Dockerfile -t "$IMAGE" tools/ai-bff
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Register task definition and update ECS service
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > td.json

          jq --arg image "$IMAGE" '
            .containerDefinitions |= map(.image = $image)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' td.json > td-new.json

          NEW_TD=$(aws ecs register-task-definition \
            --cli-input-json file://td-new.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TD" \
            --query service.serviceName \
            --output text

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
