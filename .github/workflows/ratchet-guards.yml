name: Ratchet Guards

# Guardrails that prevent known tech debt from GROWING (never fail just for existing
# debt — they fail only if a tracked count goes UP). This lets us pay debt down calmly.
# See docs/reports/contract-ui-churn-analysis.md (§8, Ola 0).
#
# - window-leak-budget: window/entity-specific literals leaking into the GENERIC
#   contract-ui components (DetailView.jsx, DataTable.jsx). Files live in THIS repo,
#   so this is the real enforcement point for the contract-ui churn problem.
#
# The method-budget ratchet (NeoDefaultsService.java) is NOT enforced here: that file
# lives in com.etendoerp.go and only changes via that repo's PRs, so it must be wired
# into the etendo-go CI to catch growth. This workflow stays focused on schema_forge.
#
# - test-hygiene: the reuse-first test protocol (docs/testing/test-reuse-policy.md) on the
#   test files a PR adds or modifies — missing/broken `@covers`, ticket-named new files,
#   assertion-less new Vitest blocks. Logic lives in scripts/check-test-hygiene.js.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  window-leak-budget:
    name: window-leak-budget (contract-ui)
    runs-on: ubuntu-latest
    env:
      SF_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Window-specific leak ratchet (fail only if it grew)
        run: npx sf-window-leak-budget --list

  test-hygiene:
    name: test-hygiene (reuse-first protocol)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SF_ROOT: ${{ github.workspace }}
      # ROLLOUT (ETP-5511, see docs/testing/test-reuse-policy.md § CI enforcement): annotate-only from 2026-09-26.
      # On 2026-10-10 flip this single switch to `block` so findings fail the job.
      TEST_HYGIENE_MODE: annotate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check changed test files
        run: >-
          node scripts/check-test-hygiene.js
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
