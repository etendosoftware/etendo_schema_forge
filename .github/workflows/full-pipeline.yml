name: Full Pipeline

# ETP-6362: the schema_forge full pipeline (Jenkins schema-forge-tests, etendo-go/schemaforge/Jenkinsfile
# in com.etendoerp.jenkins.pipelines) as parallel GitHub Actions jobs, the same shape as
# com.etendoerp.go's full-pipeline-pilot.yml. Jenkins builds the environment while the mocked suite
# runs, then runs the integration suite; here each block is its own job, so a failed block re-runs
# alone ("Re-run failed jobs").
#
#   mocked       E2E_SUITE=mocked: the SPA against a mocked backend, no database. Named apart from the
#                Mini Pipeline's "Mocked E2E" (PRs into develop), so a check of that name on the same
#                commit can never stand in for this one.
#   integration  the environment Jenkins builds (com.etendoerp.go's .github/actions/etendo-env:
#                etendo-localenv, its own PostgreSQL, the shared snapshot cache, the GOClient seeds,
#                smartbuild), Tomcat, jsreport and E2E_SUITE=integration.
#   public-api   ETP-6370: the public API suite (gateway/e2e) on its own environment, signed in as
#                GOAdmin of GOClient; only when a PR touches the public API (always on a push).
#   cell-report  after every test job: the TESTS POR CÉLULA report with the E2E columns only (cell-report.mjs,
#                from com.etendoerp.jenkins.pipelines), the run summary and, when DD_API_KEY exists,
#                the run sent to Datadog as etendo.ci.pilot.* metrics. Reporting only: it never turns
#                the run red.
#   unit-tests   ETP-6375: the unit tests, the Sonar analysis with their coverage and, on a PR, the
#                coverage gate against main and the quality gate (.github/actions/unit-tests-sonar).
#                They ran in test.yml on every PR and push before.
# A push to main that merges a validated cut skips every test job; validated-cut-sonar keeps main's
# Sonar analysis (the base the next PRs compare against) with the coverage of the cut's PR run.
#
# Where the results are: the run summary and, for 30 days, the run's artifacts:
#   cell-report                    TESTS POR CÉLULA (index.html) and its summary.json
#   unit-coverage                  the unit tests' JUnit XML and merged LCOV
#   playwright-report-mocked       the mocked suite's Playwright report
#   playwright-report-integration  the integration suite's Playwright report, with the retries' traces
#   local-env-logs                 the environment build and Tomcat logs, and the runner load
#   pw-cell-results-*              the raw results cell-report reads
#   public-api-e2e                 the public API suite's JUnit, the gateway log and the env logs
#
# Secrets: SONAR_TOKEN/SONAR_HOST_URL publish the analysis and SONAR_READ_TOKEN reads the coverage and
# the quality gate; ETENDOBOT_TOKEN reads etendo_core, com.etendoerp.go, etendo-localenv, the GitHub modules
# and the npm packages; BITBUCKET_SSH_KEY clones the Bitbucket modules and
# com.etendoerp.jenkins.pipelines; LOCALENV_CACHE_RO_KEY/SECRET read the snapshot cache; DD_API_KEY
# (optional, EU site) sends the metrics. No Nexus credentials: building the environment does not
# need them (ETP-6367).
# The public API job also uses PUBLIC_API_E2E_EMAIL/PASSWORD (GOAdmin of the GOClient sample data)
# and CORE_DEPLOY_KEY (reads schema_forge_core).

# Only what reaches main: the daily cut (mergeblock/*), a hotfix (hotfix/*) and the push to main.
# Feature branches keep the mini pipeline (mini-pipeline.yml) on their PRs into develop.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR replaces its running check; each push to main is measured on its own.
concurrency:
  group: full-pipeline-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CORE_BRANCH: epic/ETP-3504
  MODULE_BRANCH: ${{ github.head_ref || github.ref_name }}
  PIPELINES_REPO: git@ssh.bitbucket.org:koodu_software/com.etendoerp.jenkins.pipelines.git
  RETENTION_DAYS: 30

jobs:
  # A push to main that merges a cut (mergeblock/*) or a hotfix (hotfix/*) carries the tree this
  # pipeline already tested on that PR: main is strict, so the merged tree equals the PR head's.
  # Jenkins' Route Build skips that push, and so does this job; validated-cut-sonar keeps main's
  # analysis with the PR run's coverage. Anything else runs in full: a PR, a dispatch, a direct push,
  # a red or missing PR run, an expired coverage artifact, or an error while looking (never a red job).
  route:
    name: Route
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      validated_run: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find the run that validated this push
        id: find
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const full = (why) => core.notice(`Full run: ${why}.`);
            try {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: sha,
              });
              const pr = prs.find(p => p.merged_at && p.merge_commit_sha === sha && p.base.ref === 'main'
                && /^(mergeblock|hotfix)\//.test(p.head.ref));
              if (!pr) return full(`${sha.slice(0, 9)} does not merge a mergeblock/* or hotfix/* PR`);
              const tree = async (s) => (await github.rest.git.getCommit({ owner, repo, commit_sha: s })).data.tree.sha;
              if (await tree(sha) !== await tree(pr.head.sha)) {
                return full(`the tree of ${sha.slice(0, 9)} differs from #${pr.number}'s head ${pr.head.sha.slice(0, 9)}`);
              }
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: 'full-pipeline.yml', head_sha: pr.head.sha,
                event: 'pull_request', per_page: 100,
              });
              const run = runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              if (!run) return full(`#${pr.number} has no full pipeline run on ${pr.head.sha.slice(0, 9)}`);
              if (run.conclusion !== 'success') {
                return full(`#${pr.number}'s run ${run.html_url} ended ${run.conclusion || run.status}`);
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
              });
              const missing = ['Unit tests + Sonar + coverage', 'Mocked E2E (full pipeline)', 'Integration (Tomcat + Playwright)', 'Public API E2E'].filter(n =>
                !jobs.some(j => j.name === n && j.conclusion === 'success'));
              if (missing.length) return full(`${run.html_url} did not pass ${missing.join(', ')}`);
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, name: 'unit-coverage',
              });
              if (!data.artifacts.some(a => !a.expired)) return full(`${run.html_url} has no unit-coverage left`);
              core.setOutput('run_id', String(run.id));
              core.notice(`#${pr.number} (${pr.head.ref}) was validated by ${run.html_url}: every test job skipped.`);
            } catch (e) {
              full(`could not look up the validated PR (${e.message})`);
            }

  # Main's Sonar branch analysis for a validated push: the scanner alone, with the coverage the PR's
  # unit-tests job uploaded (coverage/merged-lcov.info, read through sonar-project.properties).
  validated-cut-sonar:
    name: Sonar with the cut coverage
    needs: route
    if: needs.route.outputs.validated_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: Sonar's blame and new-code detection need it.
          fetch-depth: 0

      - name: Download the PR run's coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          run-id: ${{ needs.route.outputs.validated_run }}
          github-token: ${{ github.token }}

      - name: Check the coverage report
        run: |
          if [ ! -s coverage/merged-lcov.info ]; then
            echo "::error::The PR run's unit-coverage has no coverage/merged-lcov.info."
            exit 1
          fi

      # Timeouts from the organization variables (ETP-6390), as in .github/actions/unit-tests-sonar.
      - name: Sonar analysis
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_SCANNER_OPTS: "-Xmx4096m"
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: -Dsonar.scanner.socketTimeout=${{ vars.SONAR_SOCKET_TIMEOUT || '60' }} -Dsonar.scanner.responseTimeout=${{ vars.SONAR_RESPONSE_TIMEOUT || '60' }}

  unit-tests:
    name: Unit tests + Sonar + coverage
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.validated_run == '' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergeblock/') || startsWith(github.head_ref, 'hotfix/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read   # npm install from npm.pkg.github.com
      checks: write    # dorny/test-reporter publishes the "Test Results" check
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The whole history: Sonar's blame and new-code detection need it.
          fetch-depth: 0

      # The action from this run's own commit, as in mini-pipeline.yml (ETP-6387).
      - name: Checkout the unit tests action
        uses: actions/checkout@v4
        with:
          path: .ci-actions
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Unit tests + Sonar + coverage
        uses: ./.ci-actions/.github/actions/unit-tests-sonar
        with:
          npm_token: ${{ secrets.GITHUB_TOKEN }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          sonar_host_url: ${{ secrets.SONAR_HOST_URL }}
          sonar_read_token: ${{ secrets.SONAR_READ_TOKEN }}
          coverage_minimum: ${{ vars.COVERAGE_MINIMUM }}
          coverage_tolerance: ${{ vars.COVERAGE_TOLERANCE }}
          sonar_socket_timeout: ${{ vars.SONAR_SOCKET_TIMEOUT }}
          sonar_response_timeout: ${{ vars.SONAR_RESPONSE_TIMEOUT }}
          retention_days: ${{ env.RETENTION_DAYS }}

  mocked:
    name: Mocked E2E (full pipeline)
    needs: route
    # branch-merge-policy.yml already rejects any other branch into main; this keeps such a PR from
    # also spending runners before it is closed. Skipped on a validated push to main.
    if: ${{ !cancelled() && needs.route.outputs.validated_run == '' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergeblock/') || startsWith(github.head_ref, 'hotfix/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read   # npm install from npm.pkg.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp .env.example .env
          make install

      # No --with-deps, as in the mini pipeline: the runner image already has every library Chromium
      # needs. The browser is cached per Playwright version and downloads only on a bump.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: npx playwright install chromium

      # The Playwright reporter of the per-cell report. Without it the suite still runs, only the
      # report misses the mocked results.
      - name: Clone the cell report scripts
        id: cell-scripts
        env:
          BITBUCKET_SSH_KEY: ${{ secrets.BITBUCKET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BITBUCKET_SSH_KEY" | tr -d '\r' > ~/.ssh/pipelines
          chmod 600 ~/.ssh/pipelines
          if GIT_SSH_COMMAND="ssh -i $HOME/.ssh/pipelines -o StrictHostKeyChecking=no" \
              git clone -q --depth 1 --branch develop "$PIPELINES_REPO" "$RUNNER_TEMP/pipelines"; then
            echo "dir=$RUNNER_TEMP/pipelines/etendo-go/utils/cell-report" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::com.etendoerp.jenkins.pipelines could not be cloned: no per-cell mocked results."
          fi

      # run-e2e-full.sh builds the no-PWA bundle, serves it, runs the mocked projects and then the
      # quarantined tests without blocking (docs/testing/flaky-tests.md). PW_TEST_REPORTER adds the
      # cell reporter, only when the file is there: Playwright aborts on a reporter it cannot load.
      - name: Mocked E2E
        env:
          E2E_SUITE: mocked
          PLAYWRIGHT_HTML_REPORT: ${{ github.workspace }}/e2e/playwright-report-mocked
          CELL_SCRIPTS: ${{ steps.cell-scripts.outputs.dir }}
        run: |
          if [ -n "$CELL_SCRIPTS" ] && [ -f "$CELL_SCRIPTS/pw-cell-reporter.cjs" ]; then
            export PW_TEST_REPORTER="$CELL_SCRIPTS/pw-cell-reporter.cjs"
            export CELL_REPORT_PW_DIR="$RUNNER_TEMP/pw-cell"
            export CELL_REPORT_PW_SUITE=e2e-mocked
          fi
          make test-e2e-headless

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mocked
          path: e2e/playwright-report-mocked
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: ignore

      - name: Upload the per-cell E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pw-cell-results-mocked
          path: ${{ runner.temp }}/pw-cell
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: ignore

  integration:
    name: Integration (Tomcat + Playwright)
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.validated_run == '' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergeblock/') || startsWith(github.head_ref, 'hotfix/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      go_branch: ${{ steps.go.outputs.branch }}
    # run-e2e-full.sh reuses a jsreport already listening on 5488, as with the Jenkins sidecar: the
    # printable specs render through it.
    services:
      jsreport:
        image: etendo/jsreport:develop
        ports:
          - 5488:5488
    steps:
      - name: Disk before the build
        run: df -h / | tee -a "$RUNNER_TEMP/disk.txt"

      # CPU, run queue, I/O wait and memory every 10 s for the whole job: when a spec times out, the
      # load summary at the end tells a saturated runner from an idle one.
      - name: Start sampling the runner load
        run: nohup vmstat -n -t 10 > "$RUNNER_TEMP/vmstat.log" 2>&1 &

      # Same order as cloneModules.groovy for a sibling repo: this branch when com.etendoerp.go has
      # it (a cut shares its name across both repos), otherwise main for a PR into main, a push to
      # main or a hotfix, develop for anything else.
      - name: Pick the com.etendoerp.go branch
        id: go
        env:
          ETENDOBOT_TOKEN: ${{ secrets.ETENDOBOT_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          repo="https://x-access-token:${ETENDOBOT_TOKEN}@github.com/etendo-ai/com.etendoerp.go.git"
          case "$BASE_REF:$MODULE_BRANCH" in
            main:*|*:main|*:hotfix/*) fallback=main ;;
            *) fallback=develop ;;
          esac
          branch="$fallback"
          if git ls-remote --exit-code --heads "$repo" "$MODULE_BRANCH" >/dev/null 2>&1; then
            branch="$MODULE_BRANCH"
          fi
          echo "com.etendoerp.go: $branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout etendo_core
        uses: actions/checkout@v4
        with:
          repository: etendo-ai/etendo_core
          token: ${{ secrets.ETENDOBOT_TOKEN }}
          ref: ${{ env.CORE_BRANCH }}
          path: etendo_core

      - name: Checkout com.etendoerp.go
        uses: actions/checkout@v4
        with:
          repository: etendo-ai/com.etendoerp.go
          token: ${{ secrets.ETENDOBOT_TOKEN }}
          ref: ${{ steps.go.outputs.branch }}
          path: etendo_core/modules/com.etendoerp.go

      # go's action checks schema_forge out at etendo_core/schema_forge on this branch (the cut's own
      # branch, or main on a push to main) before local-env loads the GOClient seeds through its plugin.
      # The snapshot cache is read-only here: com.etendoerp.go's full pipeline publishes the snapshots.
      - name: Build the Etendo GO environment
        id: build-env
        uses: ./etendo_core/modules/com.etendoerp.go/.github/actions/etendo-env
        with:
          etendobot_token: ${{ secrets.ETENDOBOT_TOKEN }}
          bitbucket_ssh_key: ${{ secrets.BITBUCKET_SSH_KEY }}
          core_branch: ${{ env.CORE_BRANCH }}
          module_branch: ${{ env.MODULE_BRANCH }}
          base_ref: ${{ github.base_ref }}
          localenv_s3_key: ${{ secrets.LOCALENV_CACHE_RO_KEY }}
          localenv_s3_secret: ${{ secrets.LOCALENV_CACHE_RO_SECRET }}

      # The action checks out the branch, this run tests one commit: a newer push to the PR cancels
      # this run, so they only differ on a re-run of an older attempt. Then test the run's commit.
      - name: Test this run's schema_forge commit
        working-directory: etendo_core/schema_forge
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # actions/checkout left its credentials in the clone, so the fetch needs no token here.
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$SHA" ]; then
            echo "::warning::$MODULE_BRANCH is at ${head:0:9}, this run tests ${SHA:0:9}: checking it out."
            git fetch -q --depth 1 origin "$SHA"
            git checkout -q "$SHA"
          fi
          echo "schema_forge: $(git rev-parse --short HEAD)"

      - name: Start Tomcat
        working-directory: etendo_core
        env:
          LE: ${{ github.workspace }}/etendo-localenv/bin/local-env.sh
          LOCALENV_CACHE: ${{ runner.temp }}/localenv-cache
          LOCALENV_UPDATE_CHECK_SECS: '0'
        run: |
          "$LE" start --tomcat
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/etendo >/dev/null && exit 0
            sleep 5
          done
          echo "::error::Etendo did not answer on http://localhost:8080/etendo"
          tail -100 build/local-env/tomcat.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: etendo_core/schema_forge/package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install schema_forge
        working-directory: etendo_core/schema_forge
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ETENDOBOT_TOKEN }}
        run: |
          cp .env.example .env
          make install

      - name: Playwright version
        id: playwright
        working-directory: etendo_core/schema_forge
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        working-directory: etendo_core/schema_forge
        run: npx playwright install chromium

      - name: Clone the cell report scripts
        id: cell-scripts
        env:
          BITBUCKET_SSH_KEY: ${{ secrets.BITBUCKET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BITBUCKET_SSH_KEY" | tr -d '\r' > ~/.ssh/pipelines
          chmod 600 ~/.ssh/pipelines
          if GIT_SSH_COMMAND="ssh -i $HOME/.ssh/pipelines -o StrictHostKeyChecking=no" \
              git clone -q --depth 1 --branch develop "$PIPELINES_REPO" "$RUNNER_TEMP/pipelines"; then
            echo "dir=$RUNNER_TEMP/pipelines/etendo-go/utils/cell-report" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::com.etendoerp.jenkins.pipelines could not be cloned: no per-cell E2E results."
          fi

      # Jenkins' "Etendo Go Playwright Test" stage: the menu cache first, then the integration suite.
      - name: Integration E2E
        working-directory: etendo_core/schema_forge
        env:
          E2E_SUITE: integration
          E2E_EMAIL_SINK: '1'
          E2E_PROVISIONING_FAILURE: '1'
          PLAYWRIGHT_HTML_REPORT: ${{ github.workspace }}/etendo_core/schema_forge/e2e/playwright-report-integration
          CELL_SCRIPTS: ${{ steps.cell-scripts.outputs.dir }}
        run: |
          npx sf-menu-cache refresh
          if [ -n "$CELL_SCRIPTS" ] && [ -f "$CELL_SCRIPTS/pw-cell-reporter.cjs" ]; then
            export PW_TEST_REPORTER="$CELL_SCRIPTS/pw-cell-reporter.cjs"
            export CELL_REPORT_PW_DIR="$RUNNER_TEMP/pw-cell"
            export CELL_REPORT_PW_SUITE=e2e-integration
          fi
          # The suite's window, for the load summary: its start, then its end even when it fails.
          date -u '+%Y-%m-%d %H:%M:%S' > "$RUNNER_TEMP/e2e-window"
          rc=0
          make test-e2e-headless || rc=$?
          date -u '+%Y-%m-%d %H:%M:%S' >> "$RUNNER_TEMP/e2e-window"
          exit $rc

      - name: Runner load during the suite
        if: always()
        working-directory: etendo_core/modules/com.etendoerp.go
        run: |
          python3 scripts/full-pipeline-pilot-report.py load --vmstat "$RUNNER_TEMP/vmstat.log" \
            --window "$RUNNER_TEMP/e2e-window" --cpus "$(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Disk and memory at the end
        if: always()
        run: |
          df -h / | tee -a "$RUNNER_TEMP/disk.txt"
          free -m
          echo "## Disk use" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/disk.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integration
          path: etendo_core/schema_forge/e2e/playwright-report-integration
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: ignore

      - name: Upload the per-cell E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pw-cell-results-integration
          path: ${{ runner.temp }}/pw-cell
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: ignore

      - name: Upload the environment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-env-logs
          path: |
            etendo_core/build/local-env/*.log
            ${{ runner.temp }}/vmstat.log
            ${{ runner.temp }}/e2e-window
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: ignore

  # ETP-6370: the public API suite (gateway/e2e), the lane ETP-6058 planned for Jenkins next to
  # Playwright. A job here has its own runner, so it builds its own environment and signs in as
  # GOAdmin of the GOClient sample data instead of waiting for Playwright's onboarding: no tenant
  # is shared with the integration suite. The suite creates and deletes its own records and its two
  # API keys on every run (scripts/public-api-e2e-ci.mjs); no key is stored anywhere.
  public-api:
    name: Public API E2E
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.validated_run == '' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergeblock/') || startsWith(github.head_ref, 'hotfix/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout schema_forge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: sf
          # The PR's diff against its target, for the change detection.
          fetch-depth: 0

      # As publicApiE2e.groovy: a PR runs the suite only when its diff touches the public API; a push
      # or a dispatch always does. Without a change every later step is skipped and the job is green.
      - name: Does this change touch the public API?
        id: changes
        working-directory: sf
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Not a PR: the suite runs."; exit 0
          fi
          files="$(git diff --name-only "origin/$BASE_REF...HEAD")" || { echo "run=true" >> "$GITHUB_OUTPUT"; echo "::warning::Could not diff against origin/$BASE_REF: the suite runs."; exit 0; }
          hits="$(printf '%s\n' "$files" | grep -E '^(gateway/.*|public-api/.*|scripts/public-api-e2e-ci\.mjs|scripts/lib/pack-gateway-core\.mjs|package(-lock)?\.json|Makefile)$' || true)"
          if [ -n "$hits" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Public API files changed:"; printf '%s\n' "$hits" | head -20
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Public API E2E skipped: no public API change in this PR." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Before the 10-minute environment: missing secrets fail at once and say which.
      - name: Check the GOAdmin secrets
        if: steps.changes.outputs.run == 'true'
        env:
          PUBLIC_API_E2E_EMAIL: ${{ secrets.PUBLIC_API_E2E_EMAIL }}
          PUBLIC_API_E2E_PASSWORD: ${{ secrets.PUBLIC_API_E2E_PASSWORD }}
        run: |
          if [ -z "$PUBLIC_API_E2E_EMAIL" ] || [ -z "$PUBLIC_API_E2E_PASSWORD" ]; then
            echo "::error::The repo secrets PUBLIC_API_E2E_EMAIL and PUBLIC_API_E2E_PASSWORD (GOAdmin of GOClient) are not set."
            exit 1
          fi

      - name: Pick the com.etendoerp.go branch
        id: go
        if: steps.changes.outputs.run == 'true'
        env:
          ETENDOBOT_TOKEN: ${{ secrets.ETENDOBOT_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          repo="https://x-access-token:${ETENDOBOT_TOKEN}@github.com/etendo-ai/com.etendoerp.go.git"
          case "$BASE_REF:$MODULE_BRANCH" in
            main:*|*:main|*:hotfix/*) fallback=main ;;
            *) fallback=develop ;;
          esac
          branch="$fallback"
          if git ls-remote --exit-code --heads "$repo" "$MODULE_BRANCH" >/dev/null 2>&1; then
            branch="$MODULE_BRANCH"
          fi
          echo "com.etendoerp.go: $branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout etendo_core
        if: steps.changes.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: etendo-ai/etendo_core
          token: ${{ secrets.ETENDOBOT_TOKEN }}
          ref: ${{ env.CORE_BRANCH }}
          path: etendo_core

      - name: Checkout com.etendoerp.go
        if: steps.changes.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: etendo-ai/com.etendoerp.go
          token: ${{ secrets.ETENDOBOT_TOKEN }}
          ref: ${{ steps.go.outputs.branch }}
          path: etendo_core/modules/com.etendoerp.go

      # The same environment as the integration job: the GOClient sample data GOAdmin signs in to.
      - name: Build the Etendo GO environment
        if: steps.changes.outputs.run == 'true'
        uses: ./etendo_core/modules/com.etendoerp.go/.github/actions/etendo-env
        with:
          etendobot_token: ${{ secrets.ETENDOBOT_TOKEN }}
          bitbucket_ssh_key: ${{ secrets.BITBUCKET_SSH_KEY }}
          core_branch: ${{ env.CORE_BRANCH }}
          module_branch: ${{ env.MODULE_BRANCH }}
          base_ref: ${{ github.base_ref }}
          localenv_s3_key: ${{ secrets.LOCALENV_CACHE_RO_KEY }}
          localenv_s3_secret: ${{ secrets.LOCALENV_CACHE_RO_SECRET }}

      - name: Start Tomcat
        if: steps.changes.outputs.run == 'true'
        working-directory: etendo_core
        env:
          LE: ${{ github.workspace }}/etendo-localenv/bin/local-env.sh
          LOCALENV_CACHE: ${{ runner.temp }}/localenv-cache
          LOCALENV_UPDATE_CHECK_SECS: '0'
        run: |
          "$LE" start --tomcat
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/etendo >/dev/null && exit 0
            sleep 5
          done
          echo "::error::Etendo did not answer on http://localhost:8080/etendo"
          tail -100 build/local-env/tomcat.log
          exit 1

      # The suite and the gateway come from this run's commit (sf/), not from the branch checkout
      # etendo-env made for the seeds.
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sf/package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install schema_forge
        if: steps.changes.outputs.run == 'true'
        working-directory: sf
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ETENDOBOT_TOKEN }}
        run: |
          cp .env.example .env
          make install

      # api-gateway-core is not published: the install packs it from the schema_forge_core tag
      # package.json pins, read with the deploy key deploy-public-api.yml uses.
      - name: Pinned schema_forge_core version
        id: core
        if: steps.changes.outputs.run == 'true'
        working-directory: sf
        # The pin sits in devDependencies; scripts/public-api-e2e-ci.mjs reads it from either.
        run: |
          v="$(node -p "const p = require('./package.json'); (p.dependencies || {})['@etendosoftware/schema-forge-core'] || (p.devDependencies || {})['@etendosoftware/schema-forge-core'] || ''")"
          if ! printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::@etendosoftware/schema-forge-core is pinned to '$v' in package.json, expected an exact x.y.z (the core's tag)."
            exit 1
          fi
          echo "schema_forge_core: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Checkout schema_forge_core at the pinned version
        if: steps.changes.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: etendo-ai/schema_forge_core
          ref: refs/tags/${{ steps.core.outputs.version }}
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          path: schema_forge_core
          persist-credentials: false

      - name: Build the gateway
        if: steps.changes.outputs.run == 'true'
        working-directory: sf
        env:
          PUBLIC_API_CORE_DIR: ${{ github.workspace }}/schema_forge_core
          NODE_AUTH_TOKEN: ${{ secrets.ETENDOBOT_TOKEN }}
        run: make public-api-e2e-ci-install

      # Signs in, creates two API keys, starts the gateway on a free port, runs the suite and always
      # deletes the keys. Its own timer stops it before the job's limit, so the cleanup still runs.
      - name: Public API E2E
        if: steps.changes.outputs.run == 'true'
        working-directory: sf
        env:
          NEO_BASE_URL: http://localhost:8080/etendo
          PUBLIC_API_E2E_EMAIL: ${{ secrets.PUBLIC_API_E2E_EMAIL }}
          PUBLIC_API_E2E_PASSWORD: ${{ secrets.PUBLIC_API_E2E_PASSWORD }}
          PUBLIC_API_E2E_RESULTS_DIR: ${{ runner.temp }}/public-api-e2e
          PUBLIC_API_E2E_TIMEOUT_MINUTES: '30'
        run: make public-api-e2e-ci

      - name: Summary
        if: always() && steps.changes.outputs.run == 'true'
        env:
          JUNIT: ${{ runner.temp }}/public-api-e2e/junit.xml
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          path = os.environ['JUNIT']
          try:
              root = ET.parse(path).getroot()
          except (OSError, ET.ParseError):
              print('## Public API E2E\n\nNo junit.xml: the suite did not start (see the step log).')
              raise SystemExit
          suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
          n = sum(int(s.get('tests', 0)) for s in suites)
          f = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
          sk = sum(int(s.get('skipped', 0)) for s in suites)
          print(f'## Public API E2E\n\n{n} tests, {f} failed, {sk} skipped')
          for case in root.iter('testcase'):
              if case.find('failure') is not None or case.find('error') is not None:
                  print(f"- {case.get('classname', '')} › {case.get('name', '')}")
          PY

      - name: Upload the results
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: public-api-e2e
          path: |
            ${{ runner.temp }}/public-api-e2e
            etendo_core/build/local-env/*.log
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: ignore

  cell-report:
    name: Cell report
    # Every test job, though it reads only the E2E results: the run's duration and the job durations
    # sent to Datadog are measured here, and a job still running would be left out of both.
    needs: [route, unit-tests, mocked, integration, public-api]
    if: ${{ !cancelled() && needs.route.outputs.validated_run == '' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergeblock/') || startsWith(github.head_ref, 'hotfix/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read   # the run's job timings, for Datadog
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout the E2E cell map
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: sf
          sparse-checkout: e2e/support

      # cell-report.mjs reads the Go cell map even with no Go results; the report script lives there.
      - name: Checkout the Go cell map and the report script
        uses: actions/checkout@v4
        with:
          repository: etendo-ai/com.etendoerp.go
          token: ${{ secrets.ETENDOBOT_TOKEN }}
          ref: ${{ needs.integration.outputs.go_branch || 'develop' }}
          path: go
          sparse-checkout: |
            src-test/cells
            scripts

      # Each reporter run writes its own pw-*.json, so both suites share one directory.
      - name: Download the mocked results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pw-cell-results-mocked
          path: results/pw

      - name: Download the integration results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pw-cell-results-integration
          path: results/pw

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone the cell report scripts
        id: cell-scripts
        continue-on-error: true
        env:
          BITBUCKET_SSH_KEY: ${{ secrets.BITBUCKET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BITBUCKET_SSH_KEY" | tr -d '\r' > ~/.ssh/pipelines
          chmod 600 ~/.ssh/pipelines
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/pipelines -o StrictHostKeyChecking=no" \
            git clone -q --depth 1 --branch develop "$PIPELINES_REPO" "$RUNNER_TEMP/pipelines"
          echo "dir=$RUNNER_TEMP/pipelines/etendo-go/utils/cell-report" >> "$GITHUB_OUTPUT"

      # As cellReport.generate(env, [goTests: false]) in Jenkins: go=pipeline, this pipeline runs no
      # Go tests. The suite states say why a suite has no results (see cell-report.mjs).
      - name: Per-cell report
        if: steps.cell-scripts.outputs.dir != ''
        continue-on-error: true
        env:
          CELL_SCRIPTS: ${{ steps.cell-scripts.outputs.dir }}
          MOCKED_RESULT: ${{ needs.mocked.result }}
          E2E_RESULT: ${{ needs.integration.result }}
        run: |
          state() { case "$1" in success) echo passed ;; failure) echo failed ;; cancelled) echo aborted ;; *) echo not-run ;; esac; }
          result=SUCCESS
          if [ "$MOCKED_RESULT" != success ] || [ "$E2E_RESULT" != success ]; then result=FAILURE; fi
          node "$CELL_SCRIPTS/cell-report.mjs" --out cell-report \
            --go-cells go/src-test/cells \
            --e2e-cells sf/e2e/support/test-cell.mjs --pw-results results/pw \
            --suite-state go=pipeline \
            --suite-state "e2e-mocked=$(state "$MOCKED_RESULT")" \
            --suite-state "e2e-integration=$(state "$E2E_RESULT")" \
            --build-url "$RUN_URL" --build-result "$result"

      - name: Summary
        continue-on-error: true
        run: |
          python3 go/scripts/full-pipeline-pilot-report.py summary --cell-summary cell-report/summary.json \
            --pw-dir results/pw --run-url "$RUN_URL" | tee -a "$GITHUB_STEP_SUMMARY"

      # Tags of few values on purpose: every distinct combination is a custom metric in Datadog.
      - name: Send the run to Datadog
        if: env.DD_API_KEY != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" > jobs.json || echo '{}' > jobs.json
          python3 go/scripts/full-pipeline-pilot-report.py datadog --cell-summary cell-report/summary.json \
            --jobs jobs.json --tag ci:github-actions --tag repo:etendo_schema_forge \
            --tag "event:$GITHUB_EVENT_NAME" --tag "kind:${MODULE_BRANCH%%/*}"

      - name: Upload the per-cell report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cell-report
          path: cell-report
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: ignore
