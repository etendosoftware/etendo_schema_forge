name: Unit tests + Sonar + coverage
description: >-
  ETP-6375: the unit tests and the Sonar analysis of schema_forge in one job, the same work
  com.etendoerp.go's "Go tests + Sonar + coverage" does. For a job that already checked this repo out
  (the whole history: Sonar's blame and new-code detection need it). The analysis runs only when
  every test passed, so Sonar never gets the coverage of a partial run. On a PR it then runs the
  coverage gate against the target branch and the analysis's quality gate
  (scripts/compare-sonar-coverage.js --check-quality-gate, docs/coverage-gate.md). The caller's job
  needs `packages: read` (npm install) and `checks: write` (the "Test Results" check).

inputs:
  npm_token:
    description: Reads the npm packages of npm.pkg.github.com.
    required: true
  sonar_token:
    description: Publishes the analysis.
    required: true
  sonar_host_url:
    description: The SonarQube server.
    required: true
  sonar_read_token:
    description: Reads the coverage and the quality gate (the analysis token gets 403 on measures).
    required: true
  coverage_minimum:
    description: Organization variable COVERAGE_MINIMUM; empty keeps the script's default.
    required: false
    default: ''
  coverage_tolerance:
    description: Organization variable COVERAGE_TOLERANCE; empty keeps the script's default.
    required: false
    default: ''
  sonar_socket_timeout:
    description: >-
      sonar.scanner.socketTimeout in seconds (organization variable SONAR_SOCKET_TIMEOUT): the longest
      the scanner waits between two packets, as when it uploads the report. Empty keeps 60.
    required: false
    default: ''
  sonar_response_timeout:
    description: >-
      sonar.scanner.responseTimeout in seconds (organization variable SONAR_RESPONSE_TIMEOUT): the
      longest the scanner waits for the server's answer. Empty keeps 60.
    required: false
    default: ''
  retention_days:
    description: Days the unit-coverage artifact is kept (a validated push to main reads it from the PR run).
    required: false
    default: '7'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        registry-url: https://npm.pkg.github.com

    - name: Install dependencies
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm_token }}
      run: npm install

    # JUnit XML in test-results/, merged LCOV in coverage/ (read by sonar-project.properties).
    - name: Unit tests with coverage
      shell: bash
      run: make test-ci-coverage

    - name: Build app-shell
      shell: bash
      run: npm run build --workspace=tools/app-shell

    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Test Results
        path: test-results/*.xml
        reporter: java-junit
        fail-on-empty: false

    # The coverage of this run: a validated push to main analyzes main with the coverage of the
    # cut's PR run instead of running the tests again (full-pipeline.yml).
    - name: Upload coverage and test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-coverage
        path: |
          coverage/merged-lcov.info
          test-results/*.xml
        retention-days: ${{ inputs.retention_days }}
        if-no-files-found: warn

    # From here on only when every step above passed: a failed test already fails the job.
    # A pull request analysis on a PR, a branch analysis on a push (the base the next PRs compare
    # against).
    # ETP-6390: the timeouts come from organization variables, so a slow SonarQube (a report upload
    # cut at 60 s on 2026-11-19) is handled by raising them, without a PR.
    - name: Sonar analysis
      uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      env:
        SONAR_SCANNER_OPTS: "-Xmx4096m"
        SONAR_TOKEN: ${{ inputs.sonar_token }}
        SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
      with:
        args: >-
          -Dsonar.scanner.socketTimeout=${{ inputs.sonar_socket_timeout || '60' }}
          -Dsonar.scanner.responseTimeout=${{ inputs.sonar_response_timeout || '60' }}

    # Fails the job when the coverage is below the minimum, more than the tolerance below the target
    # branch, or cannot be evaluated (--context ci), and when this analysis's quality gate failed
    # (--check-quality-gate): the gate "SonarQube Code Analysis" reports, read in the same wait.
    - name: Compare coverage with the base branch
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar_read_token }}
        SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_BRANCH: ${{ github.base_ref }}
        COVERAGE_MINIMUM: ${{ inputs.coverage_minimum }}
        COVERAGE_TOLERANCE: ${{ inputs.coverage_tolerance }}
      # The script is the PR head's, which can predate --check-quality-gate (ETP-6374): a main into
      # develop back-merge, a branch that never merged develop. Then compare the coverage alone and
      # say the gate was not read (ETP-6387, as com.etendoerp.go's ETP-6326).
      run: |
        gate=--check-quality-gate
        if ! grep -q -- "--check-quality-gate" scripts/compare-sonar-coverage.js; then
          gate=
          msg="The checked-out compare-sonar-coverage.js predates --check-quality-gate: quality gate not read here."
          echo "::warning::$msg"
          echo "> $msg" >> "$GITHUB_STEP_SUMMARY"
        fi
        node scripts/compare-sonar-coverage.js --context ci \
          --pull-request "$PR_NUMBER" --base-branch "$BASE_BRANCH" \
          --report-task .scannerwork/report-task.txt $gate
